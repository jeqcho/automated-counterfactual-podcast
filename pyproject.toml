[project]
name = "counterfactual-podcast"
version = "0.1.0"
description = "Rank Trello reading lists by counterfactual impact and produce a TTS listen-queue podcast"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "trafilatura>=1.8",
    "pypdf>=4.0",
    "anthropic>=0.40",
    "feedgen>=1.0",
    "mutagen>=1.47",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "numpy>=2.4.6",
    "soundfile>=0.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfactual_podcast"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
